# nginx in front of an oc app on the same host. The app owns all security headers; add none here.
# Replace journal.example.org and the certificate paths. For an airgapped box see AIRGAP.md.

server {
    listen 80;
    listen [::]:80;
    server_name journal.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name journal.example.org;

    ssl_certificate     /etc/ssl/certs/journal.example.org.pem;
    ssl_certificate_key /etc/ssl/private/journal.example.org.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Server-sent events must not be buffered or cut off.
    location ~ /live$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
