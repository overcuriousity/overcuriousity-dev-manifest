[package]
name = "oc-kit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
askama = "0.16"
tower-sessions = "0.15"
tower-sessions-sqlx-store = { version = "0.15.1", features = ["sqlite"] }
serde_json = "1"
serde_urlencoded = "0.7"
urlencoding = "2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "time"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
argon2 = { version = "0.5", features = ["std"] }
rand = "0.9"
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
tower-http = { version = "0.6", features = ["compression-gzip", "compression-br", "limit", "timeout", "trace", "sensitive-headers"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
figment = { version = "0.10", features = ["toml", "env"] }
url = { version = "2", features = ["serde"] }
ipnet = { version = "2", features = ["serde"] }
thiserror = "2"
axum = "0.8"
rust-embed = { version = "8", features = ["debug-embed", "include-exclude"] }
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
temp-env = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
