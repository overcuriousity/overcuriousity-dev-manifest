<button type="{% if submit %}submit{% else %}button{% endif %}" class="oc-btn oc-btn--icon{% if row %} oc-btn--row{% endif %}" aria-label="{{ label }}" data-oc-tip="{{ self.tip() }}"{% if let Some(k) = shortcut %} data-oc-shortcut="{{ k }}"{% endif %}{% if reveal %} data-oc-reveal{% endif %}{% if let Some(p) = pressed %} aria-pressed="{{ p }}"{% endif %}{{ attrs }}>{{ self.svg() }}</button>
