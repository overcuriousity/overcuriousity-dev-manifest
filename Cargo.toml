[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "2026.11.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/overcuriousity/overcuriousity-dev-manifest"
authors = ["overcuriousity"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
